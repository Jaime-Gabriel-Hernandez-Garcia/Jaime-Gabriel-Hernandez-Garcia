name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jaime-Gabriel-Hernandez-Garcia
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#89B4FA&color_dots=#EBEDF0,#BAE6FD,#90CDF4,#60A5FA,#2563EB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#89B4FA&color_dots=#161B22,#1E3E62,#2D4B73,#4682B4,#89B4FA

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
